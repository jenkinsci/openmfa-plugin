config.section.title=OpenMFA 配置
config.requireMFA.title=要求所有用户启用 MFA
config.issuer.title=发行者名称
config.mfaManagement.title=MFA 用户管理
config.rememberMfaHours.title=为"保持登录状态"记住 MFA（小时数）
config.rememberMfaHours.description=登录时勾选"保持登录状态"的用户在多少小时内无需重复进行 MFA 验证。设置为 0 可禁用。

# Exemption configuration messages
config.exemptions.title=MFA 豁免
config.exemptUsers.title=豁免用户
config.exemptUsers.description=每行一个用户名。豁免用户可完全绕过 MFA。
config.exemptRoles.title=豁免角色/组
config.exemptRoles.description=每行一个角色。具有这些角色的用户可绕过 MFA。

# WebAuthn configuration messages
config.allowWebAuthn.title=允许使用 WebAuthn 安全密钥
config.allowWebAuthn.description=允许用户将 WebAuthn 安全密钥注册并用作第二因素登录。
config.webAuthnRpId.title=WebAuthn 依赖方 ID（高级）
config.webAuthnRpId.description=留空以从 Jenkins 根 URL 推导。仅在了解其作用时才设置此项。
config.webAuthnAllowedOrigins.title=其他允许的 WebAuthn 来源（高级）
config.webAuthnAllowedOrigins.description=每行一个来源，例如 https://jenkins.example.com。仅当 Jenkins 可通过多个主机名访问时才需要。
