config.section.title=OpenMFA Configuration
config.requireMFA.title=Require MFA for all users
config.issuer.title=Issuer Name
config.mfaManagement.title=MFA User Management
config.rememberMfaHours.title=Remember MFA for "Keep me signed in" (hours)
config.rememberMfaHours.description=How many hours users who checked "Keep me signed in" at login skip repeated MFA prompts. Set to 0 to disable.

# Exemption configuration messages
config.exemptions.title=MFA Exemptions
config.exemptUsers.title=Exempt Users
config.exemptUsers.description=One username per line. Exempted users bypass MFA entirely.
config.exemptRoles.title=Exempt Roles/Groups
config.exemptRoles.description=One role per line. Users with these roles bypass MFA.

# WebAuthn configuration messages
config.allowWebAuthn.title=Allow WebAuthn security keys
config.allowWebAuthn.description=Lets users register and sign in with WebAuthn security keys as a second factor.
config.webAuthnRpId.title=WebAuthn Relying Party ID (advanced)
config.webAuthnRpId.description=Leave empty to derive from the Jenkins root URL. Only set this if you know what it does.
config.webAuthnAllowedOrigins.title=Additional allowed WebAuthn origins (advanced)
config.webAuthnAllowedOrigins.description=One origin per line, e.g. https://jenkins.example.com. Only needed if Jenkins is reachable under multiple hostnames.
