security:
  openMFA:
    issuer: 'Jenkins'
    requireMFA: true
    rememberMfaHours: 5
    rememberMfaKey: 'test-signing-key'
    exemptUsers:
      - svc-deploy
      - break-glass
    exemptRoles:
      - ci-agents
      - service-accounts
    allowWebAuthn: false
    webAuthnRpId: 'jenkins.example.com'
    webAuthnAllowedOrigins:
      - 'https://jenkins.example.com'
